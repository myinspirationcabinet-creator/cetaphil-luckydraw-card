<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>세타필 럭키드로우</title>
<style>
/* 시스템 한글 폰트 — 아이패드: Apple SD Gothic Neo, Android: Noto Sans KR, 기타 */
</style>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
html, body { width:100%; height:100%; overflow:hidden; background:#0050b4; font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }

#bg-wrap { position:fixed; inset:0; }
#bg-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; pointer-events:none; }

#card-zone { position:absolute; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }
#card-grid { display:grid; grid-template-columns:1fr 1fr; }

/*
  카드 플립 구조:
  - .card-wrap: perspective + border-radius + overflow:hidden (코너 클리핑)
  - .card: transform-style:preserve-3d, NO overflow (preserve-3d와 충돌)
  - .card-face: backface-visibility:hidden
  
  핵심: overflow:hidden을 .card가 아닌 .card-wrap에 적용
  → preserve-3d는 .card에만, 클리핑은 부모(wrap)에서
*/
.card-wrap {
  cursor:pointer;
  -webkit-user-select:none; user-select:none;
  overflow:visible;   /* 카드 이미지 자체가 투명 PNG로 라운드 처리되어 있음 */
  background:transparent;
  perspective:1200px;
}
.card {
  position:relative;
  width:100%; height:100%;
  transform-style:preserve-3d;
  transition:transform 0.65s cubic-bezier(0.4,0,0.2,1);
}
.card.flipped { transform:rotateY(180deg); }
.card-face {
  position:absolute; inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  display:flex; align-items:center; justify-content:center;
  background:transparent;
  border:none;
  flex-direction:column; gap:0;
  padding:0;
}
.card-back { transform:rotateY(180deg); }

/* 앞면 스타일 */
.card-front-inner {
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  width:100%; height:100%; gap:6%;
}
.card-front-title {
  font-weight:900; color:#111; text-align:center;
  line-height:1.25; word-break:keep-all;
}

/* 뒷면 경품 스타일 */
.card-back-inner {
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  width:100%; height:100%; gap:8%;
}
.prize-rank-text {
  font-weight:900; color:#2eb8b8; line-height:1;
}
.prize-desc-text {
  font-weight:500; color:#2eb8b8; text-align:center;
  line-height:1.4; word-break:keep-all; white-space:pre-line;
}

#reset-btn {
  background:transparent;
  border:none;
  border-radius:0;
  box-shadow:none;
  padding:0;
  cursor:pointer;
  transition:transform 0.15s, opacity 0.15s;
}
#reset-btn:active { transform:scale(0.96); opacity:0.85; }

#settings-btn {
  position:fixed; top:14px; right:14px; z-index:200;
  width:42px; height:42px; border-radius:50%; border:none;
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
}
#settings-btn:active { background:rgba(255,255,255,0.5); }
#settings-btn svg { width:22px; height:22px; fill:white; }

/* 관리자 */
#admin-overlay { position:fixed; inset:0; z-index:300; background:rgba(60,180,210,0.3); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; }
#admin-overlay.hidden { display:none; }
#admin-panel { background:white; border-radius:20px; width:min(96%,720px); max-height:92vh; overflow:hidden; box-shadow:0 24px 64px rgba(0,0,0,0.22); display:flex; flex-direction:column; }
.admin-tabs { display:flex; border-bottom:2px solid #f0f0f0; padding:0 20px; flex-shrink:0; }
.tab-btn { padding:14px 16px 12px; font-size:13px; font-weight:700; font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; border:none; background:none; color:#bbb; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; transition:color 0.2s,border-color 0.2s; }
.tab-btn.active { color:#2eb8b8; border-bottom-color:#2eb8b8; }
.tab-content { display:none; padding:16px 20px 18px; overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1; }
.tab-content.active { display:block; }

.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; }
.stat-card { background:#f0fbfb; border-radius:10px; padding:10px 6px; text-align:center; }
.stat-card .val { font-size:20px; font-weight:900; color:#2eb8b8; }
.stat-card .lbl { font-size:11px; color:#888; margin-top:2px; }

.prize-row { background:#f7fafc; border-radius:10px; padding:11px 13px; margin-bottom:8px; }
.prize-row-header { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
.prize-rank { font-size:16px; font-weight:900; color:#2eb8b8; min-width:26px; }
.prize-name-input { flex:1; border:1.5px solid #e2ecf0; border-radius:7px; padding:6px 9px; font-size:13px; font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; outline:none; }
.prize-name-input:focus { border-color:#2eb8b8; }
.prize-qty-row { display:grid; grid-template-columns:1fr 1fr 70px; gap:8px; align-items:center; }
.qty-group label { font-size:10px; color:#bbb; font-weight:600; display:block; margin-bottom:3px; }
.qty-group input { width:100%; border:1.5px solid #e2ecf0; border-radius:7px; padding:6px 8px; font-size:13px; font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; outline:none; }
.qty-group input:focus { border-color:#2eb8b8; }
.prob-badge { text-align:center; font-size:12px; font-weight:700; color:#2eb8b8; }
.section-title { font-size:12px; font-weight:700; color:#555; margin-bottom:10px; }

.time-range-row { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.time-range-row label { font-size:13px; color:#555; }
.time-range-row input[type="number"] { width:52px; border:1.5px solid #e2ecf0; border-radius:7px; padding:5px 6px; font-size:13px; text-align:center; font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; outline:none; }
.regen-btn { background:#e0f5f5; border:none; border-radius:7px; padding:6px 10px; font-size:11px; font-weight:700; color:#2eb8b8; cursor:pointer; font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }
.auto-btn  { background:#f0f0f0; border:none; border-radius:7px; padding:6px 10px; font-size:11px; font-weight:700; color:#555;    cursor:pointer; font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }

.hourly-table { width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; }
.hourly-table th { background:#f0fbfb; color:#2eb8b8; font-weight:700; padding:7px 4px; text-align:center; border-bottom:2px solid #d8f0f0; font-size:11px; white-space:nowrap; }
.hourly-table th.time-col { width:82px; } .hourly-table th.count-col { width:56px; } .hourly-table th.sum-col { width:48px; }
.hourly-table td { padding:5px 3px; text-align:center; border-bottom:1px solid #f0f0f0; vertical-align:middle; }
.hourly-table tr:last-child td { border-bottom:none; }
.hourly-table tr.foot-row td { border-top:2px solid #e0f5f5; font-weight:700; background:#fafffe; border-bottom:none; }
.hourly-table input[type="number"] { width:100%; max-width:52px; border:1.5px solid #e2ecf0; border-radius:5px; padding:3px 2px; font-size:11px; text-align:center; font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; outline:none; }
.hourly-table input:focus { border-color:#2eb8b8; }
.total-badge { display:inline-block; background:#f0fbfb; border-radius:5px; padding:2px 6px; font-size:11px; font-weight:700; color:#2eb8b8; }
.total-badge.over { background:#fee2e2; color:#dc2626; }
.time-label { font-size:11px; font-weight:600; color:#444; }
.rank-1{color:#d4920f;font-weight:800;} .rank-2{color:#5a82c8;font-weight:700;} .rank-3{color:#4ab872;font-weight:700;} .rank-4{color:#b060a0;font-weight:700;}

.admin-actions { display:flex; gap:8px; padding:12px 20px; border-top:1px solid #f0f0f0; flex-shrink:0; }
.btn-back   { background:#f3f4f6; color:#666;    border:none; border-radius:9px; padding:10px 14px; font-size:13px; font-weight:700; font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; cursor:pointer; }
.btn-danger { background:#fee2e2; color:#dc2626; border:none; border-radius:9px; padding:10px 14px; font-size:13px; font-weight:700; font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; cursor:pointer; }
.btn-save   { flex:1; background:#2eb8b8; color:white; border:none; border-radius:9px; padding:10px; font-size:14px; font-weight:700; font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; cursor:pointer; min-width:80px; }
.btn-save:active { background:#25a0a0; }


/* ── 반응형 ─────────────────────────────────────────────────── */
/* 모바일: 배경이미지 위 카드 영역을 뷰포트 기준으로 재배치 */
@media (max-width: 600px) {
  /* 배경이미지를 cover에서 contain으로 변경해 전체 보이게 */
  #bg-img { object-fit: contain; }
  /* 관리자 패널 */
  #admin-panel { border-radius: 12px; }
  .admin-tabs { padding: 0 10px; }
  .tab-btn { padding: 10px 10px 8px; font-size: 11px; }
  .tab-content { padding: 12px 12px 14px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .prize-qty-row { grid-template-columns: 1fr 1fr; }
  .admin-actions { flex-wrap: wrap; }
  .btn-save { min-width: 0; }
  .hourly-table { font-size: 10px; }
  .hourly-table input[type="number"] { max-width: 40px; }
}
@media (max-width: 400px) {
  .tab-btn { padding: 8px 6px; font-size: 10px; }
  .prize-row-header { flex-wrap: wrap; }
}
/* 태블릿 세로 모드 */
@media (min-width: 601px) and (max-width: 1024px) and (orientation: portrait) {
  #bg-img { object-fit: contain; }
}
/* 데스크탑: 관리자 패널 여유있게 */
@media (min-width: 1025px) {
  #admin-panel { width: min(90%, 760px); }
}
/* 히스토리 */
.history-empty { text-align:center; padding:32px 0; color:#bbb; font-size:14px; }
.history-summary { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.history-summary-item { background:#f0fbfb; border-radius:8px; padding:7px 12px; font-size:12px; font-weight:700; color:#2eb8b8; }
.history-table { width:100%; border-collapse:collapse; font-size:13px; }
.history-table th { background:#f0fbfb; color:#2eb8b8; font-weight:700; padding:8px 10px; text-align:left; border-bottom:2px solid #d8f0f0; font-size:12px; }
.history-table th:last-child { text-align:right; }
.history-table td { padding:9px 10px; border-bottom:1px solid #f4f4f4; vertical-align:middle; }
.history-table tr:last-child td { border-bottom:none; }
.history-table tr:hover td { background:#fafffe; }
.rank-badge { display:inline-block; border-radius:5px; padding:2px 8px; font-size:12px; font-weight:800; }
.rb-1 { background:#fff3d0; color:#d4920f; }
.rb-2 { background:#dce8ff; color:#5a82c8; }
.rb-3 { background:#d8f4e2; color:#4ab872; }
.rb-4 { background:#f4d8ef; color:#b060a0; }
.history-time { font-size:12px; color:#888; font-family:monospace; }
.history-clear-btn { margin-top:12px; background:#fee2e2; color:#dc2626; border:none; border-radius:8px; padding:7px 14px; font-size:12px; font-weight:700; cursor:pointer; font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }
</style>

  const p1per=Math.floor(30/n), p1diff=30-p1per*n;
  const p2per=Math.floor(100/n), p2diff=100-p2per*n;
  for(let h=s;h<e;h++){

    arr.push({
      hour:h,
      count:per+(idx===0?diff:0),
      prizeRatios:[3.75,12.5,25,58.75],

// ── 레이아웃 ─────────────────────────────
function layout(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const bgR=BG_W/BG_H, vpR=vw/vh;

  // object-fit 동적 전환: 가로(landscape)는 cover, 세로(portrait)는 contain
  const isPortrait = vh > vw;
  const bgImg = document.getElementById('bg-img');
  bgImg.style.objectFit = isPortrait ? 'contain' : 'cover';

  let imgW,imgH,imgX,imgY;
  // contain 기준으로 항상 계산 (cover일 때도 카드 위치는 실제 이미지 기준)
  if(vpR>bgR){imgW=vw;imgH=vw/bgR;imgX=0;imgY=(vh-imgH)/2;}
  else{imgH=vh;imgW=vh*bgR;imgX=(vw-imgW)/2;imgY=0;}

  const bL=imgX+imgW*BOX.l, bR=imgX+imgW*BOX.r;
  const bT=imgY+imgH*BOX.t, bB=imgY+imgH*BOX.b;
  const bW=bR-bL, bH=bB-bT;

  // 모바일 최소 크기 보장
  const minFS = vw < 500 ? 11 : 10;
  const btnFS=Math.max(minFS,bH*0.038), btnPV=Math.max(5,bH*0.028), btnPH=Math.max(16,bW*0.045);
  const btnH=btnFS+btnPV*2, gap=Math.max(5,bH*0.03), cGap=Math.max(14,Math.min(bW,bH)*0.045);
  const gridAvH=bH-btnH-gap;
  const cW_w=(bW-cGap)/2, cH_w=cW_w/CARD_RATIO;
  const cH_h=(gridAvH-cGap)/2, cW_h=cH_h*CARD_RATIO;
  let cW,cH,gW;
  if(cH_w*2+cGap<=gridAvH){cW=cW_w;cH=cH_w;gW=bW;}
  else{cW=cW_h;cH=cH_h;gW=cW_h*2+cGap;}
  const gH=cH*2+cGap;

  // 코너 반경: 카드 이미지 자체에 라운드 배경 포함 → CSS 클리핑 불필요
  const radius=0;

  const totalH=gH+gap+btnH;
  Object.assign(document.getElementById('card-zone').style,{
    position:'absolute', top:(bT+(bH-totalH)/2)+'px', left:(bL+(bW-gW)/2)+'px',
    width:gW+'px', height:totalH+'px',
    display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'flex-start'
  });
  Object.assign(document.getElementById('card-grid').style,{
    gridTemplateColumns:cW+'px '+cW+'px', gap:cGap+'px', width:gW+'px'
  });

  // 카드 이미지 자체가 이미 투명 라운드 처리되어 있으므로
  // card-wrap/card에 추가 클리핑(overflow+radius)을 적용하지 않음
  document.querySelectorAll('.card-wrap').forEach(w=>{
    w.style.width=cW+'px';
    w.style.height=cH+'px';
  });
  document.querySelectorAll('.card').forEach(c=>{
    c.style.width=cW+'px';
    c.style.height=cH+'px';
  });

  // 버튼: 이미지 비율 771:183 유지
  const btnImgH = Math.max(44, bH * 0.115);
  const btnImgW = btnImgH * (1191/395);  // 전체 이미지 비율 유지 (투명 포함)
  Object.assign(document.getElementById('reset-btn').style,{
    marginTop: gap+'px',
    width:  btnImgW+'px',
    height: btnImgH+'px',
    fontSize: '',
    padding: '0',
    borderRadius: '0'
  });

  // 이미지 카드 — 텍스트 크기 조정 불필요
}

let flipped=new Set();

function buildCards(){
  flipped.clear();

  state.frontCards.forEach((fc,i)=>{

    front.className='card-face card-front';
    front.style.padding='0'; front.style.border='none'; front.style.background='transparent';

    const fi=document.createElement('img');
    fi.src=FRONT_IMGS[i]; fi.style.cssText='width:100%;height:100%;object-fit:fill;display:block;';
    front.appendChild(fi);

    // 뒷면 — 경품 텍스트 카드 (flipCard에서 내용 채움)
    const back=document.createElement('div');
    back.className='card-face card-back';
    back.style.padding='0'; back.style.border='none'; back.style.background='transparent';
    const bi=document.createElement('img');
    bi.id='pimg-'+i;
    bi.style.cssText='width:100%;height:100%;object-fit:fill;display:block;';
    back.appendChild(bi);

    card.appendChild(front); card.appendChild(back);
    wrap.appendChild(card);
    wrap.addEventListener('click', ()=>flipCard(i));
    grid.appendChild(wrap);
  });

  layout();
}

// ── 카드 플립 ────────────────────────────
function flipCard(idx){
  if(flipped.has(idx)) return;
  flipped.add(idx);

  // 1) 당첨 결정
  const prizeIdx = drawPrize();   // 0~3 또는 -1(소진)
  const useIdx   = prizeIdx >= 0 ? prizeIdx : 2;  // 소진 시 3등 fallback

  // 2) 뒷면 경품 이미지 세팅
  const PRIZE_IMGS=[window._P6, window._P7, window._P8, window._P9];
  document.getElementById('pimg-'+idx).src = PRIZE_IMGS[useIdx];

  // 3) 수량 차감 + 시간대 한도 카운트 + 히스토리 기록
  if(prizeIdx >= 0){
    state.prizes[prizeIdx].remaining = Math.max(0, state.prizes[prizeIdx].remaining-1);
    state.totalDraws++;
    const slot2 = getCurrentSlot();
    if(slot2){
      if(prizeIdx===0) slot2.p1Used=(slot2.p1Used||0)+1;
      if(prizeIdx===1) slot2.p2Used=(slot2.p2Used||0)+1;
    }
    const now = new Date();
    const pad = n=>String(n).padStart(2,'0');
    if(!state.history) state.history=[];
    state.history.unshift({
      time: pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds()),
      rank: state.prizes[prizeIdx].rank,
      name: state.prizes[prizeIdx].name,
      prizeIdx: prizeIdx,
      day: state.currentDay,                     // 1 또는 2 (당첨 시점의 일차)
      slotLabel: slot2 ? slot2.label : null,      // 당첨 시점의 슬롯 라벨 (시간대 외면 null)
      slotIdx: state.currentSlotIdx               // 당첨 시점의 슬롯 인덱스
    });
    saveState();
  }

  // 4) 클릭 비활성화

// ── 당첨 로직 ────────────────────────────
// 현재 시간대 비율에 따른 가중치 랜덤 추첨
// PRIZES[0]=1등, [1]=2등, [2]=3등워시, [3]=3등로션
// 자동 모드: 실제 현재 시각 기준으로 슬롯 자동 탐색
// 수동 모드: 관리자가 지정한 currentDay/currentSlotIdx 사용
function findSlotByTime(slots, nowMin){
  for(let i=0;i<slots.length;i++){
    const s=slots[i];
    if(s.startH===undefined) continue;
    const startMin=s.startH*60+s.startM, endMin=s.endH*60+s.endM;
    if(nowMin>=startMin && nowMin<endMin) return i;
  }
  return -1;
}

function todayStr(){
  const n=new Date();
  return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
}

// 히스토리 기반으로 특정 일차/슬롯의 3등·4등 당첨 건수 계산
function getSlotPrizeCounts(day, slotIdx){
  let c3=0, c4=0;
  (state.history||[]).forEach(h=>{
    if(h.day===day && h.slotIdx===slotIdx && h.slotLabel){
      if(h.prizeIdx===2) c3++;
      if(h.prizeIdx===3) c4++;
    }
  });
  return {c3, c4};
}

// 운영시간 외(슬롯 없음 상태)에서 발생한 당첨 집계
function getOutOfHoursCounts(){
  let c1=0,c2=0,c3=0,c4=0;
  (state.history||[]).forEach(h=>{
    if(!h.slotLabel){
      if(h.prizeIdx===0) c1++;
      if(h.prizeIdx===1) c2++;
      if(h.prizeIdx===2) c3++;
      if(h.prizeIdx===3) c4++;
    }
  });
  return {c1,c2,c3,c4};
}

function getCurrentSlot(){
  if(state.autoSlotMode){
    const now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
    const today=todayStr();

    // 날짜가 설정되어 있으면: 오늘 날짜와 일치하는 day만 검사 (더 정확함)
    if(state.eventDate1 || state.eventDate2){
      if(state.eventDate1 && today===state.eventDate1){
        const i1=findSlotByTime(state.day1Slots, nowMin);
        state.currentDay=1;
        if(i1>=0){ state.currentSlotIdx=i1; return state.day1Slots[i1]; }
        return null; // 1일차이지만 운영시간 외
      }
      if(state.eventDate2 && today===state.eventDate2){
        const i2=findSlotByTime(state.day2Slots, nowMin);
        state.currentDay=2;
        if(i2>=0){ state.currentSlotIdx=i2; return state.day2Slots[i2]; }
        return null; // 2일차이지만 운영시간 외
      }
      // 오늘이 행사일이 아님 — 시뮬레이션/테스트로 간주, 시간만으로 판단
    }

    // 날짜 미설정 또는 행사일 아닌 날(테스트) → 시간만으로 1일차 슬롯 우선 검사
    const i1=findSlotByTime(state.day1Slots, nowMin);
    const i2=findSlotByTime(state.day2Slots, nowMin);
    if(i1>=0){ state.currentDay=1; state.currentSlotIdx=i1; return state.day1Slots[i1]; }
    if(i2>=0){ state.currentDay=2; state.currentSlotIdx=i2; return state.day2Slots[i2]; }
    return null;
  }
  // 수동 모드
  const slots = state.currentDay===1 ? state.day1Slots : state.day2Slots;
  const si = state.currentSlotIdx||0;
  return slots[si]||null;
}

function drawPrize(){
  const slot = getCurrentSlot();
  const pool=[];

  // 1등(3.75%): 잔여 있고 슬롯 한도 안 넘었을 때
  if(state.prizes[0].remaining>0 && slot && (slot.p1Used||0)<(slot.p1Limit||0)){
    for(let k=0;k<4;k++) pool.push(0);
  }
  // 2등(12.5%): 잔여 있고 슬롯 한도 안 넘었을 때
  if(state.prizes[1].remaining>0 && slot && (slot.p2Used||0)<(slot.p2Limit||0)){
    for(let k=0;k<13;k++) pool.push(1);
  }
  // 3등(25%): SA 워시+로션 세트 — 가치↑ → 확률 낮게
  if(state.prizes[2].remaining>0){
    for(let k=0;k<25;k++) pool.push(2);
  }
  // 4등(58.75%): 단품 랜덤 1종 — 가장 자주 나옴 (총 470개)
  if(state.prizes[3].remaining>0){
    for(let k=0;k<59;k++) pool.push(3);
  }

  if(!pool.length) return -1;
  return pool[Math.floor(Math.random()*pool.length)];
}

// 빠른 조정: 현재 슬롯에 강제로 당첨 1건 추가 (수동 보정용)
function quickAdjustPrize(prizeIdx, delta){
  if(state.prizes[prizeIdx].remaining<=0){ showToast('⚠️ 잔여 수량이 없습니다.'); return; }
  state.prizes[prizeIdx].remaining = Math.max(0, state.prizes[prizeIdx].remaining-delta);
  state.totalDraws+=delta;
  const slot=getCurrentSlot();
  if(slot){
    if(prizeIdx===0) slot.p1Used=(slot.p1Used||0)+delta;
    if(prizeIdx===1) slot.p2Used=(slot.p2Used||0)+delta;
  }
  const now=new Date(); const pad=n=>String(n).padStart(2,'0');
  if(!state.history) state.history=[];
  state.history.unshift({
    time: pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds())+' (수동)',
    rank: state.prizes[prizeIdx].rank, name: state.prizes[prizeIdx].name, prizeIdx
  });
  saveState();
  renderAdmin();
  showToast(`✅ ${state.prizes[prizeIdx].rank}등 수동 처리 완료 (잔여 ${state.prizes[prizeIdx].remaining}개)`);
}

// 잔여 수량만 직접 가감 (슬롯 한도와 무관하게 재고만 조정)
function quickAdjustRemaining(prizeIdx, delta){
  const p=state.prizes[prizeIdx];
  p.remaining = Math.max(0, Math.min(p.total, p.remaining+delta));
  saveState();
  renderAdmin();
}

}

function updateRatioSum(ri){const vals=state.prizes.map((_,pi)=>parseFloat(document.getElementById('hr-'+ri+'-'+pi).value)||0);const sum=vals.reduce((a,b)=>a+b,0);const el=document.getElementById('rsum-'+ri);if(!el)return;el.textContent=sum.toFixed(1)+'%';el.className='total-badge'+(Math.abs(sum-100)<0.6?'':' over');}
function updateHourlyTotal(){const vals=state.hourly.map((_,i)=>parseInt(document.getElementById('hc-'+i)?.value)||0);const sum=vals.reduce((a,b)=>a+b,0);const totalP=state.prizes.reduce((s,p)=>s+p.total,0);const el=document.getElementById('hourly-total');if(el){el.textContent=sum;el.className='total-badge'+(sum>totalP?' over':'');}}
function autoDistribute(){const total=state.prizes.reduce((s,p)=>s+p.total,0),n=state.hourly.length;if(!n)return;const per=Math.floor(total/n),diff=total-per*n;state.hourly.forEach((h,i)=>{h.count=per+(i===0?diff:0);const el=document.getElementById('hc-'+i);if(el)el.value=h.count;});updateHourlyTotal();}
function applyRatioToAll(){if(!state.hourly.length)return;const ratios=state.prizes.map((_,pi)=>parseFloat(document.getElementById('hr-0-'+pi)?.value)||0);state.hourly.forEach((h,ri)=>{h.prizeRatios=[...ratios];ratios.forEach((r,pi)=>{const el=document.getElementById('hr-'+ri+'-'+pi);if(el)el.value=r.toFixed(1);});updateRatioSum(ri);});}
function resetRatios(){const def=[5.66,18.87,37.74,37.74];state.hourly.forEach((h,ri)=>{h.prizeRatios=[...def];def.forEach((r,pi)=>{const el=document.getElementById('hr-'+ri+'-'+pi);if(el)el.value=r.toFixed(1);});updateRatioSum(ri);});}

function saveSettings(){
  try{

      const pn=document.getElementById('pn-'+i), pt=document.getElementById('pt-'+i), pr=document.getElementById('pr-'+i);
      if(pn) p.name=pn.value;
      if(pt) p.total=parseInt(pt.value)||0;
      if(pr) p.remaining=parseInt(pr.value)||0;
    });
    ['day1','day2'].forEach(dk=>{
      const slots = dk==='day1' ? state.day1Slots : state.day2Slots;
      slots.forEach((sl,ri)=>{
        const e1=document.getElementById(dk+'-p1lim-'+ri); if(e1) sl.p1Limit=parseInt(e1.value)||0;
        const e2=document.getElementById(dk+'-p2lim-'+ri); if(e2) sl.p2Limit=parseInt(e2.value)||0;
      });
    });
    saveState();
    buildCards();
    showToast('✅ 저장되었습니다!');
    renderAdmin();

    showToast('⚠️ 저장 중 오류: '+err.message);

  }
}
// regenLimits → renderHourlyTable로 대체됨

function getVal(id){ return parseInt(document.getElementById(id)?.value)||0; }

function makeSlots(sh,sm,eh,em, sh2,sm2,eh2,em2){
  // 세션1: sh:sm ~ eh:em, 세션2: sh2:sm2 ~ eh2:em2
  // 30분 단위로 슬롯 생성
  const slots=[];
  function addSlots(startH,startM,endH,endM){
    let h=startH, m=startM;
    while(h*60+m < endH*60+endM){
      const nh = m===30 ? h+1 : h;
      const nm = m===30 ? 0 : 30;
      const label=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}~${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`;
      // 기존 슬롯에서 한도/사용 값 유지
      const ex = [...(state.day1Slots||[]),...(state.day2Slots||[])].find(s=>s.label===label);
      slots.push({ label, p1Limit: ex?ex.p1Limit:1, p2Limit: ex?ex.p2Limit:3, p1Used: ex?ex.p1Used:0, p2Used: ex?ex.p2Used:0 });
      h=nh; m=nm;
    }
  }
  addSlots(sh,sm,eh,em);
  addSlots(sh2,sm2,eh2,em2);
  return slots;
}

function regenSlotsFromTime(){
  if(!confirm('입력한 시간으로 슬롯을 재생성합니까?\n기존 슬롯 한도 설정은 초기화됩니다.')) return;
  // 1일차
  const d1s1h=getVal('d1-s1-h'),d1s1m=getVal('d1-s1-m');
  const d1e1h=getVal('d1-e1-h'),d1e1m=getVal('d1-e1-m');
  const d1s2h=getVal('d1-s2-h'),d1s2m=getVal('d1-s2-m');
  const d1e2h=getVal('d1-e2-h'),d1e2m=getVal('d1-e2-m');
  // 2일차
  const d2s1h=getVal('d2-s1-h'),d2s1m=getVal('d2-s1-m');
  const d2e1h=getVal('d2-e1-h'),d2e1m=getVal('d2-e1-m');
  const d2s2h=getVal('d2-s2-h'),d2s2m=getVal('d2-s2-m');
  const d2e2h=getVal('d2-e2-h'),d2e2m=getVal('d2-e2-m');

  state.day1Slots=makeSlots(d1s1h,d1s1m,d1e1h,d1e1m, d1s2h,d1s2m,d1e2h,d1e2m);
  state.day2Slots=makeSlots(d2s1h,d2s1m,d2e1h,d2e1m, d2s2h,d2s2m,d2e2h,d2e2m);
  state.currentSlotIdx=0;
  saveState();
  renderHourlyTable();
  alert('슬롯이 재생성됐습니다!');
}

function doActualReset(){
  try{
    state.prizes.forEach(p=>p.remaining=p.total);
    state.totalDraws=0;
    state.history=[];
    [state.day1Slots, state.day2Slots].forEach(slots=>{
      if(slots) slots.forEach(s=>{ s.p1Used=0; s.p2Used=0; });
    });
    saveState();
    renderAdmin();
    closeResetModal();
    showToast('🔄 초기화 완료');
  }catch(err){
    showToast('⚠️ 초기화 중 오류: '+err.message);
    console.error('doActualReset error:', err);
  }
}

function renderHistory(){
  if(!state.history) state.history=[];
  const wrap=document.getElementById('history-wrap');
  if(!wrap) return;
  if(state.history.length===0){
    wrap.innerHTML='<div class="history-empty">아직 당첨 내역이 없습니다.</div>';
    return;
  }
  // 등수별 집계
  const counts=[0,0,0,0];
  state.history.forEach(h=>{ if(h.prizeIdx>=0&&h.prizeIdx<4) counts[h.prizeIdx]++; });
  const colors=['rank-1','rank-2','rank-3','rank-4'];
  const rbClass=['rb-1','rb-2','rb-3','rb-4'];
  const summary=state.prizes.map((p,i)=>
    `<div class="history-summary-item"><span class="${colors[i]}">${p.rank}등</span> ${counts[i]}건</div>`).join('');
  const rows=state.history.map((h,i)=>{
    const pi=h.prizeIdx>=0?h.prizeIdx:2;
    return `<tr>
      <td><span class="history-time">${h.time}</span></td>
      <td><span class="rank-badge ${rbClass[pi]}">${h.rank}등</span></td>
      <td style="font-size:12px;color:#444">${h.name}</td>
    </tr>`;
  }).join('');
  wrap.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div style="font-size:12px;font-weight:700;color:#555">총 ${state.history.length}건</div>
      <button class="history-clear-btn" onclick="clearHistory()">히스토리 초기화</button>
    </div>
    <div class="history-summary">${summary}</div>
    <table class="history-table">
      <thead><tr><th>시간</th><th>등수</th><th>경품명</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}
function clearHistory(){
  if(!confirm('당첨 히스토리를 초기화하시겠습니까?')) return;
  state.history=[];
  saveState();
  renderHistory();
}
